<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escalate to Retention</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #1a1a1a;
      min-height: 100vh;
    }

    header {
      background: #002B5C;
      padding: 16px 24px;
      border-bottom: 4px solid #CC0000;
    }

    header h1 {
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
    }

    .voice-tag {
      display: none;
      background: #eef2f6;
      border-bottom: 1px solid #dde3ea;
      padding: 8px 24px;
      font-size: 12px;
      color: #002B5C;
    }

    .form-wrap {
      max-width: 420px;
      margin: 28px auto;
      background: #ffffff;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .form-wrap p.subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #002B5C;
      margin-bottom: 4px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid #ccd3db;
      border-radius: 4px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus { border-color: #002B5C; }

    .form-group textarea { resize: vertical; min-height: 70px; }

    .send-btn {
      width: 100%;
      padding: 11px;
      background: #CC0000;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      cursor: pointer;
      margin-top: 4px;
    }

    .send-btn:hover { background: #aa0000; }

    .success-msg {
      display: none;
      text-align: center;
      padding: 12px 0 4px;
    }

    .success-msg .icon { font-size: 32px; margin-bottom: 10px; }

    .success-msg p {
      color: #002B5C;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .success-msg span { font-size: 12px; color: #666; }
  </style>
</head>
<body>

<header>
  <h1>Escalate to Retention Queue</h1>
</header>

<div class="voice-tag" id="voiceTag">
  Linked voice call: <span id="voiceTagValue"></span>
</div>

<div class="form-wrap">

  <div id="escalationForm">
    <p class="subtitle">Send this customer's cancellation request to the Retention Queue. Fill in what you have and hit Send — no need to stay on this screen.</p>

    <div class="form-group">
      <label for="custName">Customer Name</label>
      <input type="text" id="custName" placeholder="Jane Smith" value="Alex Johnson" />
    </div>

    <div class="form-group">
      <label for="acctNum">Account / Policy Number</label>
      <input type="text" id="acctNum" placeholder="ACC-123456" value="ACC-123456" />
    </div>

    <div class="form-group">
      <label for="reason">Reason for Cancellation</label>
      <input type="text" id="reason" placeholder="Service issue, billing, etc." value="Billing" />
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Brief details for the retention team"></textarea>
    </div>

    <button class="send-btn" onclick="sendToRetention()">Send to Retention</button>
  </div>

  <div class="success-msg" id="successMsg">
    <div class="icon">✅</div>
    <p>Sent to Retention Queue</p>
    <span>You can close this and continue with the call.</span>
  </div>

</div>

<script type="text/javascript" charset="utf-8">
(function (g, e, n, es, ys) {
  g['_genesysJs'] = e;
  g[e] = g[e] || function () {
    (g[e].q = g[e].q || []).push(arguments)
  };
  g[e].t = 1 * new Date();
  g[e].c = es;
  ys = document.createElement('script'); ys.async = 1; ys.src = n; ys.charset = 'utf-8'; document.head.appendChild(ys);
})(window, 'Genesys', 'https://apps.usw2.pure.cloud/genesys-bootstrap/genesys.min.js', {
  environment: 'prod-usw2',
  // Reusing the existing First American Web Messaging deployment --
  // the bot flow behind it branches on context.escalationTarget below
  // to route this to Retention Queue instead of its normal path.
  deploymentId: 'b1ab33f7-8ca3-4767-8929-4a3df7c5c2e8'
});

// Keep the launcher hidden -- this page fires the message itself,
// the agent doesn't need to see or manage the chat window.
Genesys('subscribe', 'Launcher:ready', function() {
  Genesys('command', 'Launcher:hide');
});

// Voice conversation this escalation originated from, injected via
// Application URL interpolation: ?voiceConversationId={{gcConversationId}}
const urlParams = new URLSearchParams(window.location.search);
const voiceConversationId = urlParams.get('voiceConversationId') || '';

if (voiceConversationId) {
  document.getElementById('voiceTagValue').textContent = voiceConversationId;
  document.getElementById('voiceTag').style.display = 'block';
}

function sendToRetention() {
  const custName = document.getElementById('custName').value.trim();
  const acctNum  = document.getElementById('acctNum').value.trim();
  const reason   = document.getElementById('reason').value.trim();
  const notes    = document.getElementById('notes').value.trim();

  // Tag the new Retention Queue conversation with everything the
  // cancellation agent captured, plus a link back to the voice call.
  Genesys('command', 'Database.set', {
    messaging: {
      customAttributes: {
        'context.customerName':               custName,
        'context.accountNumber':               acctNum,
        'context.cancellationReason':          reason,
        'context.notes':                       notes,
        'context.originatingVoiceConversationId': voiceConversationId,
        // Flag the bot flow checks (via Get Participant Data + Decision)
        // to route this message to Retention Queue instead of its
        // normal destination.
        'context.escalationTarget':            'RetentionQueue'
      }
    }
  });

  // Open the widget just long enough to send the initial message,
  // then let it run in the background.
  const summary = 'Cancellation escalation\n'
    + 'Customer: ' + (custName || 'n/a') + '\n'
    + 'Account/Policy #: ' + (acctNum || 'n/a') + '\n'
    + 'Reason: ' + (reason || 'n/a') + '\n'
    + 'Notes: ' + (notes || 'n/a');

  // MessagingService is lazy-loaded when Messenger opens, so wait for
  // its ready event before sending the message.
  Genesys('subscribe', 'MessagingService.ready', function () {
    Genesys('command', 'MessagingService.sendMessage', { message: summary },
      function () { /* sent */ },
      function () { /* failed to send - conversation may still show in transcript for retry */ }
    );
  });

  Genesys('command', 'Launcher:show');
  Genesys('command', 'Messenger:open');

  document.getElementById('escalationForm').style.display = 'none';
  document.getElementById('successMsg').style.display = 'block';
}
</script>

</body>
</html>
